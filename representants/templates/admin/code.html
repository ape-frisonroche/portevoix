{% extends "admin/base_site.html" %}
{% block content %}
{% if info %}<p>{{ info }}</p>{% endif %}
{% if erreur %}<p class="errornote">{{ erreur }}</p>{% endif %}
{% if a_email %}
<form method="post">
  {% csrf_token %}
  <p><label for="code">Code reçu par email :</label>
  <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus></p>
  <input type="submit" value="Valider">
</form>
<p><a href="{{ request.get_full_path }}">Renvoyer un code</a> (vérifiez aussi vos indésirables)</p>
{% endif %}
<form method="post" action="{% url 'admin:logout' %}">{% csrf_token %}<input type="submit" value="Annuler (se déconnecter)"></form>
{% endblock %}
